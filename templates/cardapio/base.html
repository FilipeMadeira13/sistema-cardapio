<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Restaurante</title>
  <link rel="stylesheet" href="../../static/cardapio/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Restaurante</a>
      <nav class="nav">
        <a href="index.html">Início</a>
        <a href="menu.html">Cardápio</a>
        <a href="#contato">Contato</a>
      </nav>
      <button class="menu-toggle" aria-label="Abrir menu">☰</button>
    </div>
  </header>

  <main class="container" id="content">
    <!-- Conteúdo da página -->
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> Restaurante — Feito com ❤</p>
      <p id="contato">Telefone: (00) 0000-0000 • Endereço: Rua Exemplo, 123</p>
    </div>
  </footer>

  <script>
    // Inserir ano atual
    document.getElementById('year').textContent = new Date().getFullYear();
    // Toggle menu simples para telas pequenas
    document.addEventListener('DOMContentLoaded', function(){
      const btn = document.querySelector('.menu-toggle');
      const nav = document.querySelector('.nav');
      btn && btn.addEventListener('click', ()=> nav.classList.toggle('open'));
    });
  </script>
</body>
</html>
